<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WebCalling</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0d0d1a;color:#e0e0e0;min-height:100vh}

#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:linear-gradient(145deg,#13132e,#1a1a3a);border:1px solid #2a2a5a;border-radius:20px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo .icon{font-size:3rem;display:block;margin-bottom:8px}
.login-logo h1{font-size:1.8rem;background:linear-gradient(135deg,#7c6af7,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
.login-logo p{color:#666;font-size:0.85rem;margin-top:4px}
.user-cards{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.user-card{background:#0f0f25;border:2px solid #2a2a4a;border-radius:14px;padding:16px 18px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:14px}
.user-card:hover{border-color:#7c6af7;background:#14143a;transform:translateY(-1px)}
.user-card.selected{border-color:#7c6af7;background:#1a1a45;box-shadow:0 0 0 3px rgba(124,106,247,0.2)}
.avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;flex-shrink:0}
.av-r{background:linear-gradient(135deg,#7c6af7,#5b4de0)}
.av-k{background:linear-gradient(135deg,#f76ca8,#e04d8a)}
.user-info h3{font-size:0.95rem;font-weight:600;color:#e0e0e0}
.user-info p{font-size:0.78rem;color:#888;margin-top:2px}
.check{margin-left:auto;color:#7c6af7;font-size:1.2rem;opacity:0}
.user-card.selected .check{opacity:1}
.pw-row{position:relative;margin-bottom:20px}
.pw-row label{display:block;font-size:0.8rem;color:#888;margin-bottom:6px}
.pw-row input{width:100%;padding:12px 44px 12px 16px;background:#0f0f25;border:1px solid #2a2a4a;border-radius:10px;color:#fff;font-size:0.95rem;outline:none;transition:border 0.2s}
.pw-row input:focus{border-color:#7c6af7}
.pw-toggle{position:absolute;right:12px;top:36px;cursor:pointer;color:#666;font-size:1rem}
.btn-login{width:100%;padding:13px;background:linear-gradient(135deg,#7c6af7,#5b4de0);border:none;border-radius:10px;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;transition:opacity 0.2s}
.btn-login:hover{opacity:0.9}
.login-err{color:#f87171;font-size:0.82rem;text-align:center;margin-top:10px;min-height:18px}

#app{display:none;height:100vh;flex-direction:column}
.topbar{background:#13132e;border-bottom:1px solid #1e1e40;padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-logo{font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,#7c6af7,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-right{display:flex;align-items:center;gap:10px}
.my-badge{display:flex;align-items:center;gap:8px;background:#0f0f25;border:1px solid #2a2a4a;border-radius:30px;padding:5px 12px 5px 6px}
.av-sm{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700}
.my-badge span{font-size:0.82rem;color:#ccc}
.conn-badge{font-size:0.75rem;padding:4px 10px;border-radius:20px;background:#0f2a0f;border:1px solid #166534;color:#4ade80}
.conn-badge.off{background:#1a0f0f;border-color:#7f1d1d;color:#f87171}
.btn-logout{background:none;border:1px solid #2a2a4a;color:#888;padding:5px 12px;border-radius:20px;cursor:pointer;font-size:0.8rem}
.btn-logout:hover{border-color:#f87171;color:#f87171}

.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:300px;background:#0f0f22;border-right:1px solid #1e1e40;display:flex;flex-direction:column;flex-shrink:0}
.sidebar-section{padding:14px;border-bottom:1px solid #1e1e40}
.sidebar-section h3{font-size:0.72rem;text-transform:uppercase;letter-spacing:1.5px;color:#444;margin-bottom:10px}

.peer-card{background:#13132e;border:1px solid #1e1e40;border-radius:14px;padding:14px;transition:all 0.3s}
.peer-card.online{border-color:#22c55e;box-shadow:0 0 14px rgba(34,197,94,0.12)}
.peer-top{display:flex;align-items:center;gap:10px}
.peer-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:700;flex-shrink:0;position:relative}
.sdot{position:absolute;bottom:1px;right:1px;width:11px;height:11px;border-radius:50%;border:2px solid #0f0f22;background:#333;transition:background 0.3s}
.sdot.on{background:#22c55e}
.peer-name{font-size:0.9rem;font-weight:600}
.peer-email{font-size:0.74rem;color:#666;margin-top:1px}
.peer-label{font-size:0.74rem;margin-top:8px;padding:3px 8px;border-radius:6px;display:inline-block}
.peer-label.online{background:rgba(34,197,94,0.1);color:#22c55e}
.peer-label.offline{background:rgba(80,80,80,0.1);color:#555}

.btn-connect{width:100%;padding:11px;background:linear-gradient(135deg,#22c55e,#16a34a);border:none;border-radius:10px;color:#fff;font-size:0.9rem;font-weight:600;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-connect:disabled{background:#1a1a30;color:#444;cursor:not-allowed}
.btn-connect:not(:disabled):hover{opacity:0.9}

.call-actions{display:flex;gap:8px;padding:14px;border-bottom:1px solid #1e1e40}
.btn-act{flex:1;padding:10px 4px;border:none;border-radius:10px;cursor:pointer;font-size:0.75rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all 0.2s}
.btn-act .ico{font-size:1.3rem}
.btn-act:disabled{opacity:0.25;cursor:not-allowed}
.bv{background:#1a1a35;color:#a78bfa}.bv:not(:disabled):hover{background:#7c6af7;color:#fff}
.bvid{background:#1a1a35;color:#60a5fa}.bvid:not(:disabled):hover{background:#2563eb;color:#fff}
.bsc{background:#1a1a35;color:#34d399}.bsc:not(:disabled):hover{background:#059669;color:#fff}

.chat-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:9px 13px;border-radius:14px;font-size:0.87rem;word-break:break-word;line-height:1.45}
.msg.me{background:linear-gradient(135deg,#7c6af7,#5b4de0);align-self:flex-end;border-bottom-right-radius:3px}
.msg.them{background:#1a1a35;border:1px solid #2a2a4a;align-self:flex-start;border-bottom-left-radius:3px}
.msg .meta{font-size:0.68rem;opacity:0.55;margin-top:4px}
.msg.fmsg{background:#0f2a1a;border:1px solid #166534}
.msg.fmsg a{color:#4ade80;text-decoration:none}
.chat-input{padding:10px 12px;border-top:1px solid #1e1e40;display:flex;gap:8px;align-items:center}
.chat-input input{flex:1;padding:10px 14px;background:#13132e;border:1px solid #2a2a4a;border-radius:10px;color:#fff;font-size:0.88rem;outline:none}
.chat-input input:focus{border-color:#7c6af7}
.btn-send{background:#7c6af7;border:none;color:#fff;padding:10px 14px;border-radius:10px;cursor:pointer;font-size:1rem}
.btn-send:disabled{background:#1a1a30;color:#444;cursor:not-allowed}
.btn-file{background:#1a1a30;border:none;color:#666;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:1rem}
.btn-file:hover{color:#a78bfa}

.video-panel{flex:1;background:#07070f;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.video-idle{text-align:center;pointer-events:none}
.video-idle .big{font-size:5rem;opacity:0.15;display:block;margin-bottom:12px}
.video-idle p{color:#2a2a4a;font-size:0.9rem}
#remote-video{width:100%;height:100%;object-fit:cover;display:none}
#local-video{position:absolute;bottom:80px;right:16px;width:180px;height:130px;border-radius:12px;object-fit:cover;border:2px solid #7c6af7;display:none;background:#111}
.call-bar{position:absolute;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,0.85));display:none;justify-content:center;gap:14px}
.call-bar.show{display:flex}
.cob{width:50px;height:50px;border-radius:50%;border:none;cursor:pointer;font-size:1.2rem;transition:transform 0.15s}
.cob:hover{transform:scale(1.1)}
.cob-mute{background:#1e1e40;color:#fff}
.cob-mute.on{background:#f59e0b}
.cob-cam{background:#1e1e40;color:#fff}
.cob-cam.off{background:#f59e0b}
.cob-end{background:#ef4444;color:#fff}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(6px)}
.modal-bg.show{display:flex}
.modal{background:#13132e;border:1px solid #2a2a5a;border-radius:20px;padding:32px;text-align:center;width:320px;box-shadow:0 20px 60px rgba(0,0,0,0.6)}
.modal .ring{font-size:3rem;margin-bottom:12px;display:block;animation:ring 0.8s infinite}
@keyframes ring{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.modal h3{font-size:1.1rem;margin-bottom:6px}
.modal p{color:#777;font-size:0.85rem;margin-bottom:24px}
.modal-btns{display:flex;gap:12px;justify-content:center}
.btn-acc{background:#22c55e;color:#fff;border:none;padding:12px 28px;border-radius:10px;cursor:pointer;font-weight:600}
.btn-dec{background:#ef4444;color:#fff;border:none;padding:12px 28px;border-radius:10px;cursor:pointer;font-weight:600}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1e1e40;border:1px solid #7c6af7;color:#a78bfa;padding:8px 20px;border-radius:20px;font-size:0.82rem;display:none;z-index:400;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#2a2a4a;border-radius:4px}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <span class="icon">📡</span>
      <h1>WebCalling</h1>
      <p>Private &amp; Secure Communication</p>
    </div>
    <div class="user-cards">
      <div class="user-card" id="card-ravi" onclick="selectUser('ravi')">
        <div class="avatar av-r">RS</div>
        <div class="user-info">
          <h3>RaviKant Singh</h3>
          <p>ravikant.s2@gmail.com</p>
        </div>
        <span class="check">✓</span>
      </div>
      <div class="user-card" id="card-rekha" onclick="selectUser('rekha')">
        <div class="avatar av-k">RK</div>
        <div class="user-info">
          <h3>Rekha Kumari</h3>
          <p>rekhasingh@gmail.com</p>
        </div>
        <span class="check">✓</span>
      </div>
    </div>
    <div class="pw-row">
      <label>Password</label>
      <input type="password" id="pw-input" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()"/>
      <span class="pw-toggle" onclick="togglePw()">👁</span>
    </div>
    <button class="btn-login" onclick="doLogin()">Sign In</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <span style="font-size:1.4rem">📡</span>
      <span class="topbar-logo">WebCalling</span>
      <span class="conn-badge off" id="conn-badge">● Connecting...</span>
    </div>
    <div class="topbar-right">
      <div class="my-badge">
        <div class="av-sm" id="my-av"></div>
        <span id="my-name-badge"></span>
      </div>
      <button class="btn-logout" onclick="doLogout()">Sign Out</button>
    </div>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-section">
        <h3>Contact</h3>
        <div class="peer-card" id="peer-card">
          <div class="peer-top">
            <div class="peer-avatar" id="peer-av">
              <div class="sdot" id="peer-dot"></div>
            </div>
            <div>
              <div class="peer-name" id="peer-name">—</div>
              <div class="peer-email" id="peer-email"></div>
            </div>
          </div>
          <span class="peer-label offline" id="peer-label">⚫ Offline</span>
        </div>
      </div>

      <div class="sidebar-section">
        <button class="btn-connect" id="btn-connect" disabled onclick="doConnect()">
          🔗 Connect
        </button>
      </div>

      <div class="call-actions">
        <button class="btn-act bv" id="btn-voice" disabled onclick="startCall('audio')">
          <span class="ico">📞</span>Voice
        </button>
        <button class="btn-act bvid" id="btn-video" disabled onclick="startCall('video')">
          <span class="ico">📹</span>Video
        </button>
        <button class="btn-act bsc" id="btn-screen" disabled onclick="shareScreen()">
          <span class="ico">🖥️</span>Screen
        </button>
      </div>

      <div class="chat-wrap">
        <div class="messages" id="messages"></div>
        <div class="chat-input">
          <input type="file" id="file-input" style="display:none" onchange="sendFile(this)"/>
          <button class="btn-file" onclick="document.getElementById('file-input').click()">📎</button>
          <input id="msg-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendChat()"/>
          <button class="btn-send" id="btn-send" disabled onclick="sendChat()">➤</button>
        </div>
      </div>
    </div>

    <div class="video-panel">
      <div class="video-idle" id="video-idle">
        <span class="big">📡</span>
        <p>Connect to start a call</p>
      </div>
      <video id="remote-video" autoplay playsinline></video>
      <video id="local-video" autoplay playsinline muted></video>
      <div class="call-bar" id="call-bar">
        <button class="cob cob-mute" id="cob-mute" onclick="toggleMute()">🎤</button>
        <button class="cob cob-cam" id="cob-cam" onclick="toggleCam()">📷</button>
        <button class="cob cob-end" onclick="endCall()">📵</button>
      </div>
    </div>
  </div>
</div>

<!-- Incoming call modal -->
<div class="modal-bg" id="call-modal">
  <div class="modal">
    <span class="ring" id="modal-icon">📞</span>
    <h3 id="modal-title">Incoming Call</h3>
    <p id="modal-desc"></p>
    <div class="modal-btns">
      <button class="btn-acc" onclick="acceptCall()">Accept</button>
      <button class="btn-dec" onclick="rejectCall()">Decline</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
// ── USERS (fixed peer IDs so they always find each other) ─────
const USERS = {
  ravi:  { name:'RaviKant Singh', email:'ravikant.s2@gmail.com',  initials:'RS', color:'linear-gradient(135deg,#7c6af7,#5b4de0)', peerId:'webcalling-ravi'  },
  rekha: { name:'Rekha Kumari',   email:'rekhasingh@gmail.com',   initials:'RK', color:'linear-gradient(135deg,#f76ca8,#e04d8a)', peerId:'webcalling-rekha' }
};
const PASSWORD = 'Pass@123';

// ── STATE ─────────────────────────────────────────────────────
let me = null, peerKey = null;
let peer = null, conn = null, activeCall = null;
let localStream = null;
let micOn = true, camOn = true;
let pendingCall = null;
let presenceTimer = null;

// ── LOGIN ─────────────────────────────────────────────────────
let selectedUser = null;

function selectUser(k) {
  selectedUser = k;
  document.querySelectorAll('.user-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('card-' + k).classList.add('selected');
  document.getElementById('login-err').textContent = '';
}

function togglePw() {
  const i = document.getElementById('pw-input');
  i.type = i.type === 'password' ? 'text' : 'password';
}

function doLogin() {
  if (!selectedUser) { setErr('Select a user first.'); return; }
  if (document.getElementById('pw-input').value !== PASSWORD) { setErr('Incorrect password.'); return; }
  me = { key: selectedUser, ...USERS[selectedUser] };
  peerKey = selectedUser === 'ravi' ? 'rekha' : 'ravi';
  renderApp();
  initPeer();
}

function setErr(m) { document.getElementById('login-err').textContent = m; }

function doLogout() {
  clearInterval(presenceTimer);
  if (activeCall) activeCall.close();
  if (conn) conn.close();
  if (peer) peer.destroy();
  peer = null; conn = null; activeCall = null; localStream = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('pw-input').value = '';
  document.getElementById('login-err').textContent = '';
  document.querySelectorAll('.user-card').forEach(c => c.classList.remove('selected'));
  selectedUser = null;
}

function renderApp() {
  const p = USERS[peerKey];
  document.getElementById('my-av').textContent = me.initials;
  document.getElementById('my-av').style.background = me.color;
  document.getElementById('my-name-badge').textContent = me.name;
  const pav = document.getElementById('peer-av');
  pav.style.background = p.color;
  pav.innerHTML = p.initials + '<div class="sdot" id="peer-dot"></div>';
  document.getElementById('peer-name').textContent = p.name;
  document.getElementById('peer-email').textContent = p.email;
  setPeerOnline(false);
  setCallEnabled(false);
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
}

// ── PEERJS INIT ───────────────────────────────────────────────
function initPeer() {
  setConnBadge(false, 'Connecting...');
  // Use PeerJS public cloud — free, no limits, no server needed
  peer = new Peer(me.peerId, {
    host: '0.peerjs.com', port: 443, path: '/', secure: true,
    config: { iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun.cloudflare.com:3478' }
    ]}
  });

  peer.on('open', id => {
    setConnBadge(true, 'Ready');
    toast('Signed in as ' + me.name);
    pingPeer();
    presenceTimer = setInterval(pingPeer, 8000);
  });

  peer.on('error', err => {
    // If ID taken (other tab), retry with timestamp suffix
    if (err.type === 'unavailable-id') {
      peer.destroy();
      peer = new Peer(me.peerId + '-' + Date.now(), {
        host: '0.peerjs.com', port: 443, path: '/', secure: true
      });
      peer.on('open', () => { setConnBadge(true, 'Ready'); pingPeer(); presenceTimer = setInterval(pingPeer, 8000); });
      peer.on('connection', onIncomingConn);
      peer.on('call', onIncomingCall);
    } else {
      setConnBadge(false, 'Error');
      toast('Connection error: ' + err.type);
    }
  });

  // Incoming data connection (chat / file / signals)
  peer.on('connection', onIncomingConn);

  // Incoming media call
  peer.on('call', onIncomingCall);
}

// ── PRESENCE PING ─────────────────────────────────────────────
function pingPeer() {
  const c = peer.connect(USERS[peerKey].peerId, { reliable: true, label: 'ping' });
  c.on('open', () => {
    c.send(JSON.stringify({ type: 'ping', name: me.name }));
    setPeerOnline(true);
    c.close();
  });
  c.on('error', () => setPeerOnline(false));
}

// ── DATA CONNECTION ───────────────────────────────────────────
function onIncomingConn(c) {
  if (c.label === 'ping') {
    c.on('data', d => {
      try {
        const msg = JSON.parse(d);
        if (msg.type === 'ping') setPeerOnline(true);
      } catch(e) {}
    });
    return;
  }
  conn = c;
  setupConn(conn);
}

function setupConn(c) {
  c.on('data', d => {
    if (typeof d === 'string') {
      const msg = JSON.parse(d);
      if (msg.type === 'chat') appendMsg(msg.text, 'them', msg.ts);
      else if (msg.type === 'call-req') showCallModal(msg.callType, msg.name);
      else if (msg.type === 'call-acc') startMediaAndCall(pendingCallType);
      else if (msg.type === 'call-rej') { pendingCallType = null; toast('Call declined ❌'); }
      else if (msg.type === 'call-end') { endCall(); toast('Call ended'); }
      else if (msg.type === 'file-start') { window._fmeta = msg; window._fchunks = []; }
      else if (msg.type === 'file-end') {
        const blob = new Blob(window._fchunks, { type: window._fmeta.mime });
        appendFileMsg(window._fmeta.name, URL.createObjectURL(blob), 'them');
      }
    } else {
      if (window._fchunks) window._fchunks.push(d);
    }
  });
  c.on('close', () => { conn = null; setCallEnabled(false); });
}

// ── CONNECT ───────────────────────────────────────────────────
function doConnect() {
  if (!peer || !peer.open) return toast('Not ready yet');
  conn = peer.connect(USERS[peerKey].peerId, { reliable: true });
  conn.on('open', () => {
    setupConn(conn);
    setCallEnabled(true);
    toast('Connected to ' + USERS[peerKey].name + ' ✅');
  });
  conn.on('error', () => toast('Could not connect — peer may be offline'));
}

// ── CALLS ─────────────────────────────────────────────────────
let pendingCallType = null;

function startCall(type) {
  if (!conn || !conn.open) return toast('Connect first');
  pendingCallType = type;
  conn.send(JSON.stringify({ type: 'call-req', callType: type, name: me.name }));
  toast('Calling ' + USERS[peerKey].name + '...');
}

function showCallModal(type, name) {
  pendingCall = { type };
  document.getElementById('modal-icon').textContent = type === 'video' ? '📹' : '📞';
  document.getElementById('modal-title').textContent = 'Incoming ' + (type === 'video' ? 'Video' : 'Voice') + ' Call';
  document.getElementById('modal-desc').textContent = name + ' is calling you...';
  document.getElementById('call-modal').classList.add('show');
}

function acceptCall() {
  document.getElementById('call-modal').classList.remove('show');
  conn.send(JSON.stringify({ type: 'call-acc' }));
  startMediaAndCall(pendingCall.type);
  pendingCall = null;
}

function rejectCall() {
  document.getElementById('call-modal').classList.remove('show');
  conn.send(JSON.stringify({ type: 'call-rej' }));
  pendingCall = null;
}

async function startMediaAndCall(type) {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: type === 'video' });
    document.getElementById('local-video').srcObject = localStream;
    document.getElementById('local-video').style.display = 'block';
    // Make PeerJS media call
    activeCall = peer.call(USERS[peerKey].peerId, localStream);
    activeCall.on('stream', remoteStream => showRemote(remoteStream));
    activeCall.on('close', endCall);
    document.getElementById('call-bar').classList.add('show');
    document.getElementById('video-idle').style.display = 'none';
  } catch(err) {
    toast('Media error: ' + err.message);
  }
}

function onIncomingCall(call) {
  activeCall = call;
  navigator.mediaDevices.getUserMedia({ audio: true, video: true })
    .then(stream => {
      localStream = stream;
      document.getElementById('local-video').srcObject = stream;
      document.getElementById('local-video').style.display = 'block';
      call.answer(stream);
      call.on('stream', remoteStream => showRemote(remoteStream));
      call.on('close', endCall);
      document.getElementById('call-bar').classList.add('show');
      document.getElementById('video-idle').style.display = 'none';
    })
    .catch(err => toast('Media error: ' + err.message));
}

function showRemote(stream) {
  const rv = document.getElementById('remote-video');
  rv.srcObject = stream;
  rv.style.display = 'block';
}

async function shareScreen() {
  if (!conn || !conn.open) return toast('Connect first');
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
    document.getElementById('local-video').srcObject = stream;
    document.getElementById('local-video').style.display = 'block';
    activeCall = peer.call(USERS[peerKey].peerId, stream);
    activeCall.on('stream', remoteStream => showRemote(remoteStream));
    stream.getVideoTracks()[0].onended = endCall;
    document.getElementById('call-bar').classList.add('show');
    document.getElementById('video-idle').style.display = 'none';
    toast('Screen sharing 🖥️');
  } catch(err) {
    toast('Screen share error: ' + err.message);
  }
}

function endCall() {
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if (activeCall) { activeCall.close(); activeCall = null; }
  if (conn && conn.open) conn.send(JSON.stringify({ type: 'call-end' }));
  ['remote-video','local-video'].forEach(id => {
    const el = document.getElementById(id);
    el.srcObject = null; el.style.display = 'none';
  });
  document.getElementById('call-bar').classList.remove('show');
  document.getElementById('video-idle').style.display = 'block';
}

function toggleMute() {
  if (!localStream) return;
  micOn = !micOn;
  localStream.getAudioTracks().forEach(t => t.enabled = micOn);
  const b = document.getElementById('cob-mute');
  b.textContent = micOn ? '🎤' : '🔇';
  b.classList.toggle('on', !micOn);
}

function toggleCam() {
  if (!localStream) return;
  camOn = !camOn;
  localStream.getVideoTracks().forEach(t => t.enabled = camOn);
  document.getElementById('cob-cam').classList.toggle('off', !camOn);
}

// ── CHAT ──────────────────────────────────────────────────────
function sendChat() {
  const inp = document.getElementById('msg-input');
  const text = inp.value.trim();
  if (!text || !conn || !conn.open) return;
  const ts = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  conn.send(JSON.stringify({ type:'chat', text, ts }));
  appendMsg(text, 'me', ts);
  inp.value = '';
}

function appendMsg(text, who, ts) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.innerHTML = esc(text) + '<div class="meta">' + ts + '</div>';
  const box = document.getElementById('messages');
  box.appendChild(d); box.scrollTop = box.scrollHeight;
}

// ── FILE TRANSFER ─────────────────────────────────────────────
function sendFile(input) {
  const file = input.files[0];
  if (!file) return;
  if (!conn || !conn.open) { toast('Connect first'); return; }
  conn.send(JSON.stringify({ type:'file-start', name:file.name, mime:file.type }));
  const CHUNK = 16384;
  let offset = 0;
  const reader = new FileReader();
  reader.onload = e => {
    conn.send(e.target.result);
    offset += e.target.result.byteLength;
    if (offset < file.size) reader.readAsArrayBuffer(file.slice(offset, offset + CHUNK));
    else {
      conn.send(JSON.stringify({ type:'file-end' }));
      appendFileMsg(file.name, URL.createObjectURL(file), 'me');
    }
  };
  reader.readAsArrayBuffer(file.slice(0, CHUNK));
  input.value = '';
}

function appendFileMsg(name, url, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who + ' fmsg';
  d.innerHTML = '📎 <a href="' + url + '" download="' + esc(name) + '">' + esc(name) + '</a><div class="meta">File ' + (who==='me'?'sent':'received') + '</div>';
  const box = document.getElementById('messages');
  box.appendChild(d); box.scrollTop = box.scrollHeight;
}

// ── HELPERS ───────────────────────────────────────────────────
function setPeerOnline(on) {
  document.getElementById('peer-card').classList.toggle('online', on);
  const dot = document.getElementById('peer-dot');
  if (dot) dot.classList.toggle('on', on);
  const lbl = document.getElementById('peer-label');
  lbl.textContent = on ? '🟢 Online' : '⚫ Offline';
  lbl.className = 'peer-label ' + (on ? 'online' : 'offline');
  document.getElementById('btn-connect').disabled = !on;
}

function setCallEnabled(on) {
  ['btn-voice','btn-video','btn-screen','btn-send'].forEach(id => {
    document.getElementById(id).disabled = !on;
  });
  document.getElementById('btn-connect').textContent = on ? '✅ Connected' : '🔗 Connect';
  document.getElementById('btn-connect').disabled = on;
}

function setConnBadge(ok, label) {
  const b = document.getElementById('conn-badge');
  b.textContent = '● ' + label;
  b.className = 'conn-badge' + (ok ? '' : ' off');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._t);
  t._t = setTimeout(() => t.style.display = 'none', 3200);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
